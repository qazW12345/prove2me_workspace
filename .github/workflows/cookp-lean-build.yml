name: CookP Lean Draft Build
on:
  push:
    branches: [agent/prove2me-probe]
    paths:
      - ".github/workflows/cookp-lean-build.yml"
      - "Solutions/CookPCompDraft.lean"
      - "scripts/fetch_cookp_definition.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROVE2ME_API_KEY: ${{ secrets.PROVE2ME_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact platform definition
        run: python3 scripts/fetch_cookp_definition.py
      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Configure Lean project
        run: |
          cat > lean-toolchain <<'EOF'
          leanprover/lean4:v4.33.1
          EOF
          cat > lakefile.lean <<'EOF'
          import Lake
          open Lake DSL
          package «prove2me» where
            leanOptions := #[⟨`autoImplicit, false⟩]
          require mathlib from git
            "https://github.com/leanprover-community/mathlib4.git" @
            "0df444a360eaa60ab8c11dca51a86af692955474"
          lean_lib «Definitions» where
          lean_lib «Theorems» where
          @[default_target]
          lean_lib «Solutions» where
          EOF
      - name: Resolve Mathlib
        run: |
          lake update
          lake exe cache get
      - name: Build composition draft
        run: lake build Solutions.CookPCompDraft
