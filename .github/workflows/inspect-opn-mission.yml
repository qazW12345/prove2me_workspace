name: Inspect Odd Perfect Number mission frontier

on:
  push:
    branches:
      - prove2me/inspect-opn-mission
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROVE2ME_API_KEY: ${{ secrets.PROVE2ME_API_KEY }}
      MISSION_ID: f37bda44-314b-4d8e-8917-fe26209e0c9c

    steps:
      - name: Fetch mission, milestones, and complete open frontier
        shell: bash
        run: |
          set -euo pipefail
          API='https://prove2.me/api/v1'
          BODY=$(jq -nc --arg k "$PROVE2ME_API_KEY" '{api_key:$k}')
          AUTH=$(curl --fail-with-body --silent --show-error             -X POST "$API/agent/refresh"             -H 'Content-Type: application/json'             -d "$BODY")
          TOKEN=$(jq -r '.access_token // empty' <<<"$AUTH")
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"

          MISSIONS=$(curl --fail-with-body --silent --show-error "$API/missions?limit=100&offset=0"             -H "Authorization: Bearer $TOKEN")
          MISSION=$(jq -c --arg id "$MISSION_ID" '.missions | map(select(.id == $id)) | first // empty' <<<"$MISSIONS")
          test -n "$MISSION"
          ROOT=$(jq -r '.main_theorem.theorem_id' <<<"$MISSION")

          echo "===== MISSION ====="
          jq '{id,name,description,mission_type,fields,creator,main_theorem}' <<<"$MISSION"

          echo "===== MILESTONES ====="
          curl --fail-with-body --silent --show-error "$API/missions/$MISSION_ID/milestones?limit=100&offset=0"             -H "Authorization: Bearer $TOKEN"             | jq '{pagination,milestones}'

          echo "===== FRONTIER ====="
          OFFSET=0
          LIMIT=100
          ALL='[]'
          while true; do
            PAGE=$(curl --fail-with-body --silent --show-error               "$API/theorems/$ROOT/open-leaves?limit=$LIMIT&offset=$OFFSET"               -H "Authorization: Bearer $TOKEN")
            ITEMS=$(jq '.open_leaves' <<<"$PAGE")
            ALL=$(jq -c --argjson a "$ALL" --argjson b "$ITEMS" '$a + $b' <<<"null")
            TOTAL=$(jq -r '.total' <<<"$PAGE")
            COUNT=$(jq 'length' <<<"$ALL")
            if (( COUNT >= TOTAL )); then break; fi
            OFFSET=$((OFFSET + LIMIT))
          done
          jq -n --arg root "$ROOT" --argjson leaves "$ALL" '{root_id:$root,total:($leaves|length),open_leaves:$leaves}'
