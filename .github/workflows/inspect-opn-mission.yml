name: Inspect Odd Perfect Number mission frontier

on:
  push:
    branches:
      - prove2me/inspect-opn-mission
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROVE2ME_API_KEY: ${{ secrets.PROVE2ME_API_KEY }}
      MISSION_ID: f37bda44-314b-4d8e-8917-fe26209e0c9c

    steps:
      - name: Survey all mission-linked open OddPerfectNumber theorems
        shell: bash
        run: |
          set -euo pipefail
          API='https://prove2.me/api/v1'
          BODY=$(jq -nc --arg k "$PROVE2ME_API_KEY" '{api_key:$k}')
          AUTH=$(curl --fail-with-body --silent --show-error             -X POST "$API/agent/refresh"             -H 'Content-Type: application/json'             -d "$BODY")
          TOKEN=$(jq -r '.access_token // empty' <<<"$AUTH")
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"

          ENC=$(printf '%s' 'OddPerfectNumber' | jq -sRr @uri)
          RESP=$(curl --fail-with-body --silent --show-error             "$API/theorems?q=$ENC&status=Open&limit=200"             -H "Authorization: Bearer $TOKEN")
          CANDS=$(jq -c '(.theorems // .items // .results // .) |
            map(select((.theorem_name // "") | startswith("OddPerfectNumber"))) ' <<<"$RESP")
          echo "Candidate namespace count: $(jq 'length' <<<"$CANDS")"

          OUT='[]'
          while IFS= read -r ROW; do
            ID=$(jq -r '.theorem_id' <<<"$ROW")
            M=$(curl --fail-with-body --silent --show-error "$API/theorems/$ID/missions"               -H "Authorization: Bearer $TOKEN")
            IN=$(jq -r --arg mid "$MISSION_ID" 'any(.missions[]?; .id == $mid)' <<<"$M")
            if [[ "$IN" == "true" ]]; then
              DETAIL=$(curl --fail-with-body --silent --show-error "$API/theorems/$ID"                 -H "Authorization: Bearer $TOKEN")
              ITEM=$(jq -c '{theorem_id,theorem_name,theorem_title,status,formal_statement,natural_language_statement,
                             source,tags,created_at}' <<<"$DETAIL")
              OUT=$(jq -cn --argjson a "$OUT" --argjson x "$ITEM" '$a + [$x]')
            fi
          done < <(jq -c '.[]' <<<"$CANDS")

          echo "===== ALL MISSION-LINKED OPEN ODDPERFECTNUMBER THEOREMS ====="
          jq 'sort_by(.theorem_name)' <<<"$OUT"
          echo "Mission-linked open count: $(jq 'length' <<<"$OUT")"
