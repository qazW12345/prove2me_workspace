name: Inspect Odd Perfect Number mission frontier

on:
  push:
    branches:
      - prove2me/inspect-opn-mission
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROVE2ME_API_KEY: ${{ secrets.PROVE2ME_API_KEY }}
      ROOT_ID: 68e5a0c5-3bc6-4be2-a323-b4caecce6f5a

    steps:
      - name: Inspect all current frontier leaves and open graph nodes
        shell: bash
        run: |
          set -euo pipefail
          API='https://prove2.me/api/v1'
          BODY=$(jq -nc --arg k "$PROVE2ME_API_KEY" '{api_key:$k}')
          AUTH=$(curl --fail-with-body --silent --show-error             -X POST "$API/agent/refresh"             -H 'Content-Type: application/json'             -d "$BODY")
          TOKEN=$(jq -r '.access_token // empty' <<<"$AUTH")
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"

          echo "===== OPEN NODES IN ROOT GRAPH ====="
          curl --fail-with-body --silent --show-error "$API/theorems/$ROOT_ID/graph"             -H "Authorization: Bearer $TOKEN"             | jq '[.. | objects | select(.status? == "Open" and .theorem_id? != null) |
                    {theorem_id,theorem_name,theorem_title,status}] | unique_by(.theorem_id)'

          for ID in             1e19be36-a9fb-45e5-aa4e-464aba65dfe9             ce554eab-1088-4764-861f-e2e862916365             37803710-70c6-47a6-8d9a-1fb406a91f30
          do
            echo "===== LEAF $ID ====="
            curl --fail-with-body --silent --show-error "$API/theorems/$ID"               -H "Authorization: Bearer $TOKEN"               | jq '{theorem_id,theorem_name,theorem_title,status,formal_statement,natural_language_statement,preamble,source,tags,mathlib_rev,created_at}'

            echo "===== SUBMISSIONS $ID ====="
            curl --fail-with-body --silent --show-error "$API/theorems/$ID/submissions"               -H "Authorization: Bearer $TOKEN"               | jq '{total:(.total // null), submissions:[(.submissions // .items // .results // [])[] |
                    {id,status,proof_type,username,accepted_at,error_message,explanation}]}'

            echo "===== DECOMPOSITIONS $ID ====="
            curl --fail-with-body --silent --show-error "$API/theorems/$ID/decompositions"               -H "Authorization: Bearer $TOKEN"               | jq '.'
          done
