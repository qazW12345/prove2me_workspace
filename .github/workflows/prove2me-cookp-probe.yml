name: Prove2Me CookP Composition Probe
on:
  push:
    branches: [agent/prove2me-probe]
    paths:
      - ".github/workflows/prove2me-cookp-probe.yml"
      - "scripts/agent_cookp_comp_probe.py"
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROVE2ME_API_KEY: ${{ secrets.PROVE2ME_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/agent_cookp_comp_probe.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent-state/cookp-compose-probe.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: record CookP compose probe"
            git pull --rebase origin agent/prove2me-probe || true
            git push || true
          fi
