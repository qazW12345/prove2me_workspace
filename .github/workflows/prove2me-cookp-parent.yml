name: Prove2Me CookP Parent Reduction
on:
  push:
    branches: [agent/prove2me-probe]
    paths:
      - ".github/workflows/prove2me-cookp-parent.yml"
      - "scripts/agent_cookp_parent_reduce.py"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROVE2ME_API_KEY: ${{ secrets.PROVE2ME_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/agent_cookp_parent_reduce.py
