name: Prove2Me Agent Probe

on:
  push:
    branches:
      - agent/prove2me-probe
    paths:
      - ".github/workflows/prove2me-probe.yml"
      - "scripts/agent_probe.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROVE2ME_API_KEY: ${{ secrets.PROVE2ME_API_KEY }}

    steps:
      - name: Check out workspace
        uses: actions/checkout@v4

      - name: Run read-only Prove2Me probe
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${PROVE2ME_API_KEY:-}" ]]; then
            echo "PROVE2ME_API_KEY secret is not available to this workflow." >&2
            exit 2
          fi
          python3 scripts/agent_probe.py

      - name: Upload sanitized probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prove2me-probe-result
          path: probe-result.json
          if-no-files-found: ignore
          retention-days: 7
