name: Prove2Me Agent Probe

on:
  push:
    branches:
      - agent/prove2me-probe
    paths:
      - ".github/workflows/prove2me-probe.yml"
      - "scripts/agent_probe.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROVE2ME_API_KEY: ${{ secrets.PROVE2ME_API_KEY }}

    steps:
      - name: Check out workspace
        uses: actions/checkout@v4

      - name: Run read-only Prove2Me probe
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${PROVE2ME_API_KEY:-}" ]]; then
            echo "PROVE2ME_API_KEY secret is not available to this workflow." >&2
            exit 2
          fi
          python3 scripts/agent_probe.py

      - name: Commit sanitized live state
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f agent-state/probe-result.json ]]; then
            echo "No sanitized state file was produced." >&2
            exit 3
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent-state/probe-result.json
          if git diff --cached --quiet; then
            echo "Live state is unchanged."
          else
            git commit -m "chore: refresh sanitized Prove2Me live state"
            git push
          fi

      - name: Upload sanitized probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prove2me-probe-result
          path: agent-state/probe-result.json
          if-no-files-found: ignore
          retention-days: 7
