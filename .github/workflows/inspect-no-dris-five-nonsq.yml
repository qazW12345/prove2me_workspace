name: Inspect no_dris_five_s_ge_two_not_even_nonsq

on:
  push:
    branches:
      - prove2me/inspect-no-dris-five-nonsq
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROVE2ME_API_KEY: ${{ secrets.PROVE2ME_API_KEY }}

    steps:
      - name: Inspect five-case family and cyclotomic child only
        shell: bash
        run: |
          set -euo pipefail
          API='https://prove2.me/api/v1'
          BODY=$(jq -nc --arg k "$PROVE2ME_API_KEY" '{api_key:$k}')
          AUTH=$(curl --fail-with-body --silent --show-error             -X POST "$API/agent/refresh"             -H 'Content-Type: application/json'             -d "$BODY")
          TOKEN=$(jq -r '.access_token // empty' <<<"$AUTH")
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"

          for NAME in             'OddPerfectNumber.no_dris_five_s_ge_two_not_even'             'OddPerfectNumber.no_dris_five_s_ge_two_not_even_sq'             'OddPerfectNumber.no_dris_five_s_ge_two_not_even_square'             'OddPerfectNumber.no_dris_five_s_ge_two'             'OddPerfectNumber.no_dris_five'
          do
            echo "===== LOOKUP: $NAME ====="
            ENC=$(printf '%s' "$NAME" | jq -sRr @uri)
            curl --fail-with-body --silent --show-error "$API/theorems?q=$ENC&limit=100"               -H "Authorization: Bearer $TOKEN"               | jq --arg n "$NAME" '(.theorems // .items // .results // .) |
                    map(select(.theorem_name == $n)) |
                    map({theorem_id,theorem_name,theorem_title,status,formal_statement,natural_language_statement,source,tags})'
          done

          echo "===== KNOWN K=5 CYCLOTOMIC CHILD ====="
          curl --fail-with-body --silent --show-error "$API/theorems/648a7dc4-9710-4052-8b9c-50b2d545ffbb"             -H "Authorization: Bearer $TOKEN"             | jq '{theorem_id,theorem_name,theorem_title,status,formal_statement,natural_language_statement,source,tags}'
