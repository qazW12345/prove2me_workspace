name: Prove2Me easy batch contribution

on:
  push:
    branches:
      - prove2me/easy-batch
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  prove-and-submit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PROVE2ME_API_KEY: ${{ secrets.PROVE2ME_API_KEY }}
      TARGET_MATHLIB_REV: 0df444a360eaa60ab8c11dca51a86af692955474
      TARGET_TOOLCHAIN: leanprover/lean4:v4.33.1

    steps:
      - name: Cancel superseded batch runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          for RUN in 36624876800 36625015149; do
            curl --silent --show-error -X POST               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN/cancel" || true
          done

      - uses: actions/checkout@v4

      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v elan >/dev/null 2>&1; then
            curl --fail --silent --show-error https://elan.lean-lang.org/elan-init.sh               | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Pin Prove2Me Lean environment
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$TARGET_TOOLCHAIN" > lean-toolchain
          cat > lakefile.lean <<'EOF'
          import Lake
          open Lake DSL

          package «prove2me» where
            leanOptions := #[⟨`autoImplicit, false⟩]

          require mathlib from git
            "https://github.com/leanprover-community/mathlib4.git" @
            "__MATHLIB_REV__"

          lean_lib «Definitions» where
          lean_lib «Theorems» where
          @[default_target]
          lean_lib «Solutions» where
          EOF
          sed -i "s/__MATHLIB_REV__/$TARGET_MATHLIB_REV/" lakefile.lean

      - name: Fetch Mathlib and prebuilt cache
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
          RESOLVED=$(git -C .lake/packages/mathlib rev-parse HEAD)
          test "$RESOLVED" = "$TARGET_MATHLIB_REV"

      - name: Compile all three exact solutions locally
        shell: bash
        run: |
          set -euo pipefail
          lake build Solutions.Sol_WorkbookCorrected_plus_53720
          lake build Solutions.Sol_WorkbookCorrected_plus_11131
          lake build Solutions.Sol_WorkbookCorrected_plus_48990
          ! grep -RniE '(^|[^[:alpha:]])sorry([^[:alpha:]]|$)'             Solutions/Sol_WorkbookCorrected_plus_53720.lean             Solutions/Sol_WorkbookCorrected_plus_11131.lean             Solutions/Sol_WorkbookCorrected_plus_48990.lean
          echo 'All local Lean builds passed.'

      - name: Authenticate to Prove2Me
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          API='https://prove2.me/api/v1'
          BODY=$(jq -nc --arg k "$PROVE2ME_API_KEY" '{api_key:$k}')
          AUTH=$(curl --fail-with-body --silent --show-error             -X POST "$API/agent/refresh"             -H 'Content-Type: application/json'             -d "$BODY")
          TOKEN=$(jq -r '.access_token // empty' <<<"$AUTH")
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Verify first target is already resolved
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          API='https://prove2.me/api/v1'
          curl --fail-with-body --silent --show-error             "$API/theorems/da6228dd-b137-41bd-b91a-a132ca409087"             -H "Authorization: Bearer $ACCESS_TOKEN" -o first.json
          jq '{theorem_id,theorem_name,status}' first.json
          test "$(jq -r '.status' first.json)" = 'Proved'

      - name: Submit remaining proof and disproof in parallel
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          API='https://prove2.me/api/v1'

          submit_one() {
            ID="$1"
            NAME="$2"
            FILE="$3"
            PROOF_TYPE="$4"
            EXPECTED_STATUS="$5"
            EXPLANATION="$6"

            TARGET_FILE="target-$ID.json"
            curl --fail-with-body --silent --show-error "$API/theorems/$ID"               -H "Authorization: Bearer $ACCESS_TOKEN" -o "$TARGET_FILE"

            STATUS_NOW=$(jq -r '.status' "$TARGET_FILE")
            NAME_NOW=$(jq -r '.theorem_name' "$TARGET_FILE")
            REV_NOW=$(jq -r '.mathlib_rev' "$TARGET_FILE")
            echo "$NAME_NOW initial status: $STATUS_NOW"

            test "$NAME_NOW" = "$NAME"
            test "$REV_NOW" = "$TARGET_MATHLIB_REV"

            if [[ "$STATUS_NOW" = "$EXPECTED_STATUS" ]]; then
              echo "$NAME is already $EXPECTED_STATUS; nothing to submit."
              return 0
            fi
            if [[ "$STATUS_NOW" != 'Open' ]]; then
              echo "$NAME resolved in unexpected direction: $STATUS_NOW" >&2
              return 31
            fi

            SUBMIT=$(curl --fail-with-body --silent --show-error               -X POST "$API/verify"               -H "Authorization: Bearer $ACCESS_TOKEN"               -F "theorem_id=$ID"               -F "file=@$FILE"               -F "proof_type=$PROOF_TYPE"               --form-string "explanation=$EXPLANATION")

            SID=$(jq -r '.submission_id // empty' <<<"$SUBMIT")
            VERIFY_STATUS=$(jq -r '.status // empty' <<<"$SUBMIT")
            test -n "$SID"
            echo "$NAME submission ID: $SID ($PROOF_TYPE)"

            for _ in $(seq 1 120); do
              if [[ "$VERIFY_STATUS" != 'PENDING' ]]; then
                break
              fi
              sleep 5

              VERDICT=$(curl --fail-with-body --silent --show-error --get "$API/verify"                 -H "Authorization: Bearer $ACCESS_TOKEN"                 --data-urlencode "submission_id=$SID")
              VERIFY_STATUS=$(jq -r '.status // empty' <<<"$VERDICT")

              curl --fail-with-body --silent --show-error "$API/theorems/$ID"                 -H "Authorization: Bearer $ACCESS_TOKEN" -o "$TARGET_FILE"
              TARGET_STATUS=$(jq -r '.status' "$TARGET_FILE")

              echo "$NAME: verifier=$VERIFY_STATUS theorem=$TARGET_STATUS"

              if [[ "$TARGET_STATUS" = "$EXPECTED_STATUS" ]]; then
                echo "$NAME resolved successfully as $EXPECTED_STATUS."
                return 0
              fi
              if [[ "$TARGET_STATUS" != 'Open' ]]; then
                echo "$NAME resolved unexpectedly as $TARGET_STATUS." >&2
                return 32
              fi
            done

            if [[ "$VERIFY_STATUS" = 'ACCEPTED' || "$VERIFY_STATUS" = 'SKETCH_ACCEPTED' ]]; then
              return 0
            fi

            curl --fail-with-body --silent --show-error "$API/theorems/$ID"               -H "Authorization: Bearer $ACCESS_TOKEN" -o "$TARGET_FILE"
            TARGET_STATUS=$(jq -r '.status' "$TARGET_FILE")
            if [[ "$TARGET_STATUS" = "$EXPECTED_STATUS" ]]; then
              echo "$NAME resolved successfully despite lagging verify poll."
              return 0
            fi

            echo "$NAME did not reach a terminal success state." >&2
            return 30
          }

          submit_one             e8882b56-97c0-4880-9aeb-8dcc1b0a7d5c             WorkbookCorrected.plus_11131             Solutions/Sol_WorkbookCorrected_plus_11131.lean             prove             Proved             'Direct arithmetic evaluation gives \(\binom{9}{6}=84\) and \(\binom{16}{6}=8008\). Thus \(286\cdot84=3\cdot8008\). Lean verifies these concrete binomial coefficients and the resulting rational identity using norm_num with Nat.choose.'             > plus_11131.log 2>&1 &
          P1=$!

          submit_one             f99db012-dac2-49e4-95ac-5460abf468f9             WorkbookCorrected.plus_48990             Solutions/Sol_WorkbookCorrected_plus_48990.lean             disprove             Disproved             'The statement is false because subtraction is natural-number subtraction and therefore truncates at zero. The concrete values give \(\binom{19}{3}=969\), \(\binom{14}{3}=364\), \(\binom{13}{3}=286\), and \(2\binom{12}{3}=440\). Thus the left-associated subtraction reaches \(319-440=0\), after which the remaining positive terms total \(176\), not \(55\). Lean verifies this exact countercalculation with norm_num and Nat.choose.'             > plus_48990.log 2>&1 &
          P2=$!

          set +e
          wait "$P1"; S1=$?
          wait "$P2"; S2=$?
          set -e

          echo '===== plus_11131 ====='
          cat plus_11131.log
          echo '===== plus_48990 ====='
          cat plus_48990.log

          test "$S1" -eq 0
          test "$S2" -eq 0
