name: Prove2Me Submission Source Probe
on:
  push:
    branches: [agent/prove2me-probe]
    paths:
      - ".github/workflows/prove2me-submission-source.yml"
      - "scripts/agent_submission_source_probe.py"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROVE2ME_API_KEY: ${{ secrets.PROVE2ME_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/agent_submission_source_probe.py
