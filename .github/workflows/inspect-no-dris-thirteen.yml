name: Inspect no_dris_thirteen_witnessed_core

on:
  push:
    branches:
      - prove2me/inspect-no-dris-thirteen
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROVE2ME_API_KEY: ${{ secrets.PROVE2ME_API_KEY }}

    steps:
      - name: Find exact theorem metadata only
        shell: bash
        run: |
          set -euo pipefail
          API='https://prove2.me/api/v1'
          NAME='OddPerfectNumber.no_dris_thirteen_witnessed_core'
          BODY=$(jq -nc --arg k "$PROVE2ME_API_KEY" '{api_key:$k}')
          AUTH=$(curl --fail-with-body --silent --show-error             -X POST "$API/agent/refresh"             -H 'Content-Type: application/json'             -d "$BODY")
          TOKEN=$(jq -r '.access_token // empty' <<<"$AUTH")
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"

          find_match() {
            jq -c --arg n "$NAME" '
              (if type=="array" then .
               elif .theorems then .theorems
               elif .items then .items
               elif .results then .results
               else [] end)
              | map(select(.theorem_name == $n))
              | first // empty
            '
          }

          TARGET=""
          for URL in             "$API/theorems?search=$(printf '%s' "$NAME" | jq -sRr @uri)&limit=200"             "$API/theorems?q=$(printf '%s' "$NAME" | jq -sRr @uri)&limit=200"             "$API/theorems?theorem_name=$(printf '%s' "$NAME" | jq -sRr @uri)&limit=200"             "$API/theorems?limit=1000"
          do
            echo "TRY $URL"
            RESP=$(curl --fail-with-body --silent --show-error "$URL"               -H "Authorization: Bearer $TOKEN" || true)
            [[ -n "$RESP" ]] || continue
            MATCH=$(find_match <<<"$RESP" || true)
            if [[ -n "$MATCH" ]]; then
              TARGET="$MATCH"
              break
            fi
            echo "$RESP" | jq '{total:(.total // null), returned:(if type=="array" then length else ((.theorems // .items // .results // [])|length) end)}' || true
          done

          if [[ -z "$TARGET" ]]; then
            echo "TARGET_NOT_FOUND"
            exit 2
          fi

          ID=$(jq -r '.theorem_id // .id' <<<"$TARGET")
          echo "===== TARGET ====="
          curl --fail-with-body --silent --show-error "$API/theorems/$ID"             -H "Authorization: Bearer $TOKEN"             | jq '{theorem_id,theorem_name,theorem_title,status,formal_statement,natural_language_statement,preamble,source,tags,mathlib_rev,created_at}'

          echo "===== MISSIONS ====="
          curl --fail-with-body --silent --show-error "$API/theorems/$ID/missions"             -H "Authorization: Bearer $TOKEN"             | jq '.'
