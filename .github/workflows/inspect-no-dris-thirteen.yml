name: Inspect no_dris_thirteen_witnessed_core

on:
  push:
    branches:
      - prove2me/inspect-no-dris-thirteen
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROVE2ME_API_KEY: ${{ secrets.PROVE2ME_API_KEY }}

    steps:
      - name: Inspect claimed dependency theorems only
        shell: bash
        run: |
          set -euo pipefail
          API='https://prove2.me/api/v1'
          BODY=$(jq -nc --arg k "$PROVE2ME_API_KEY" '{api_key:$k}')
          AUTH=$(curl --fail-with-body --silent --show-error             -X POST "$API/agent/refresh"             -H 'Content-Type: application/json'             -d "$BODY")
          TOKEN=$(jq -r '.access_token // empty' <<<"$AUTH")
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"

          for Q in sigma_prime_pow_even dris_packaged_absurd
          do
            echo "===== $Q ====="
            ENC=$(printf '%s' "$Q" | jq -sRr @uri)
            curl --fail-with-body --silent --show-error "$API/theorems?q=$ENC&limit=100"               -H "Authorization: Bearer $TOKEN"               | jq '(.theorems // .items // .results // .) |
                    map(select((.theorem_name // "") | contains("'"$Q"'"))) |
                    map({theorem_id,theorem_name,theorem_title,status,formal_statement,natural_language_statement,preamble,source,tags,mathlib_rev})'
          done
