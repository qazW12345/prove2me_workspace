name: Prove2Me easy pair contribution

on:
  push:
    branches:
      - prove2me/easy-pair-2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-and-submit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PROVE2ME_API_KEY: ${{ secrets.PROVE2ME_API_KEY }}
      TARGET_MATHLIB_REV: 0df444a360eaa60ab8c11dca51a86af692955474
      TARGET_TOOLCHAIN: leanprover/lean4:v4.33.1

    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v elan >/dev/null 2>&1; then
            curl --fail --silent --show-error https://elan.lean-lang.org/elan-init.sh               | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Pin Prove2Me Lean environment
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$TARGET_TOOLCHAIN" > lean-toolchain
          cat > lakefile.lean <<'EOF'
          import Lake
          open Lake DSL

          package «prove2me» where
            leanOptions := #[⟨`autoImplicit, false⟩]

          require mathlib from git
            "https://github.com/leanprover-community/mathlib4.git" @
            "__MATHLIB_REV__"

          lean_lib «Definitions» where
          lean_lib «Theorems» where
          @[default_target]
          lean_lib «Solutions» where
          EOF
          sed -i "s/__MATHLIB_REV__/$TARGET_MATHLIB_REV/" lakefile.lean

      - name: Fetch Mathlib and prebuilt cache
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
          RESOLVED=$(git -C .lake/packages/mathlib rev-parse HEAD)
          test "$RESOLVED" = "$TARGET_MATHLIB_REV"

      - name: Compile both exact solutions locally
        shell: bash
        run: |
          set -euo pipefail
          lake build Solutions.Sol_WorkbookCorrected_plus_23470
          lake build Solutions.Sol_WorkbookCorrected_plus_10935
          ! grep -RniE '(^|[^[:alpha:]])sorry([^[:alpha:]]|$)'             Solutions/Sol_WorkbookCorrected_plus_23470.lean             Solutions/Sol_WorkbookCorrected_plus_10935.lean
          echo 'Both local Lean builds passed.'

      - name: Authenticate to Prove2Me
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          API='https://prove2.me/api/v1'
          BODY=$(jq -nc --arg k "$PROVE2ME_API_KEY" '{api_key:$k}')
          AUTH=$(curl --fail-with-body --silent --show-error             -X POST "$API/agent/refresh"             -H 'Content-Type: application/json'             -d "$BODY")
          TOKEN=$(jq -r '.access_token // empty' <<<"$AUTH")
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Submit both still-open proofs in parallel
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          API='https://prove2.me/api/v1'

          submit_one() {
            ID="$1"
            NAME="$2"
            FILE="$3"
            EXPLANATION="$4"

            TARGET_FILE="target-$ID.json"
            curl --fail-with-body --silent --show-error "$API/theorems/$ID"               -H "Authorization: Bearer $ACCESS_TOKEN" -o "$TARGET_FILE"

            STATUS_NOW=$(jq -r '.status' "$TARGET_FILE")
            NAME_NOW=$(jq -r '.theorem_name' "$TARGET_FILE")
            REV_NOW=$(jq -r '.mathlib_rev' "$TARGET_FILE")

            test "$NAME_NOW" = "$NAME"
            test "$REV_NOW" = "$TARGET_MATHLIB_REV"

            if [[ "$STATUS_NOW" = 'Proved' ]]; then
              echo "$NAME is already Proved; skipping."
              return 0
            fi
            test "$STATUS_NOW" = 'Open'

            SUBMIT=$(curl --fail-with-body --silent --show-error               -X POST "$API/verify"               -H "Authorization: Bearer $ACCESS_TOKEN"               -F "theorem_id=$ID"               -F "file=@$FILE"               -F "proof_type=prove"               --form-string "explanation=$EXPLANATION")

            SID=$(jq -r '.submission_id // empty' <<<"$SUBMIT")
            VERIFY_STATUS=$(jq -r '.status // empty' <<<"$SUBMIT")
            test -n "$SID"
            echo "$NAME submission ID: $SID"

            for _ in $(seq 1 120); do
              if [[ "$VERIFY_STATUS" != 'PENDING' ]]; then
                break
              fi
              sleep 5

              VERDICT=$(curl --fail-with-body --silent --show-error --get "$API/verify"                 -H "Authorization: Bearer $ACCESS_TOKEN"                 --data-urlencode "submission_id=$SID")
              VERIFY_STATUS=$(jq -r '.status // empty' <<<"$VERDICT")

              curl --fail-with-body --silent --show-error "$API/theorems/$ID"                 -H "Authorization: Bearer $ACCESS_TOKEN" -o "$TARGET_FILE"
              TARGET_STATUS=$(jq -r '.status' "$TARGET_FILE")
              echo "$NAME: verifier=$VERIFY_STATUS theorem=$TARGET_STATUS"

              if [[ "$TARGET_STATUS" = 'Proved' ]]; then
                return 0
              fi
              if [[ "$TARGET_STATUS" != 'Open' ]]; then
                echo "$NAME resolved unexpectedly as $TARGET_STATUS" >&2
                return 32
              fi
            done

            if [[ "$VERIFY_STATUS" = 'ACCEPTED' || "$VERIFY_STATUS" = 'SKETCH_ACCEPTED' ]]; then
              return 0
            fi

            curl --fail-with-body --silent --show-error "$API/theorems/$ID"               -H "Authorization: Bearer $ACCESS_TOKEN" -o "$TARGET_FILE"
            test "$(jq -r '.status' "$TARGET_FILE")" = 'Proved'
          }

          submit_one             8779691c-d26b-450e-adbc-cd0547c06676             WorkbookCorrected.plus_23470             Solutions/Sol_WorkbookCorrected_plus_23470.lean             'Direct arithmetic evaluation of the two binomial coefficients proves the identity. Lean computes \(\binom{35}{20}\) and \(\binom{35}{16}\) exactly and verifies that multiplying the former by 9 equals 4 times their sum. The proof uses norm_num together with the recursive definition of Nat.choose.'             > plus_23470.log 2>&1 &
          P1=$!

          submit_one             ee47a407-b315-4bb6-b955-cc2b240f4ada             WorkbookCorrected.plus_10935             Solutions/Sol_WorkbookCorrected_plus_10935.lean             'Direct arithmetic gives \(\binom{12}{2}=66\), \(\binom{6}{2}=15\), and \(\binom{60}{2}=1770\). Hence the numerator is \(2\cdot66+6\cdot15=222\), so the ratio is \(222/1770=37/295\). Lean certifies these exact computations with norm_num and Nat.choose.'             > plus_10935.log 2>&1 &
          P2=$!

          set +e
          wait "$P1"; S1=$?
          wait "$P2"; S2=$?
          set -e

          echo '===== plus_23470 ====='
          cat plus_23470.log
          echo '===== plus_10935 ====='
          cat plus_10935.log

          test "$S1" -eq 0
          test "$S2" -eq 0
