name: Prove2Me Cleanup Batch

on:
  push:
    branches:
      - agent/prove2me-probe
    paths:
      - ".github/workflows/prove2me-cleanup.yml"
      - "scripts/agent_cleanup_submit.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROVE2ME_API_KEY: ${{ secrets.PROVE2ME_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Submit and poll cleanup batch
        run: python3 scripts/agent_cleanup_submit.py
      - name: Commit sanitized verdicts
        if: always()
        shell: bash
        run: |
          if [[ -f agent-state/cleanup-result.json ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add agent-state/cleanup-result.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: record Prove2Me cleanup verdicts"
              git push
            fi
          fi
