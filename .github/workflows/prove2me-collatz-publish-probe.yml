name: Prove2Me Collatz Publish Probe
on:
  push:
    branches: [prove2me/collatz-residual-recursive-decompose]
    paths:
      - ".github/workflows/prove2me-collatz-publish-probe.yml"
      - "scripts/agent_collatz_publish_probe.py"
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROVE2ME_API_KEY: ${{ secrets.PROVE2ME_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/agent_collatz_publish_probe.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent-state/collatz-recursive-publish-probe.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: record Collatz publish probe"
            git pull --rebase origin prove2me/collatz-residual-recursive-decompose || true
            git push || true
          fi
