name: Prove2Me CookP Decompose
on:
  push:
    branches: [agent/prove2me-probe]
    paths:
      - ".github/workflows/prove2me-cookp-decompose.yml"
      - "scripts/agent_cookp_decompose.py"
permissions:
  contents: write
jobs:
  decompose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PROVE2ME_API_KEY: ${{ secrets.PROVE2ME_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/agent_cookp_decompose.py
      - name: Commit result
        if: always()
        run: |
          if [[ -f agent-state/cookp-decompose.json ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add agent-state/cookp-decompose.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: record CookP decomposition result"
              git pull --rebase origin agent/prove2me-probe || true
              git push || true
            fi
          fi
