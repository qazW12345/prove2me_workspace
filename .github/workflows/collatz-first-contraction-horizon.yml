name: Collatz First-Contraction Horizon

on:
  push:
    branches: [prove2me/collatz-residual-recursive-decompose]
    paths:
      - "scripts/analyze_collatz_first_contraction_horizon.py"
      - "agent-state/collatz-stabilization-records.json"
      - ".github/workflows/collatz-first-contraction-horizon.yml"

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compute exact first-contraction horizon
        run: python3 scripts/analyze_collatz_first_contraction_horizon.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent-state/collatz-first-contraction-horizon.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: record first-contraction horizon"
            git pull --rebase origin prove2me/collatz-residual-recursive-decompose || true
            git push || true
          fi
