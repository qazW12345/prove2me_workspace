name: Prove2Me smoke discovery

on:
  push:
    branches:
      - prove2me/smoke-test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROVE2ME_API_KEY: ${{ secrets.PROVE2ME_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Prove2Me
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          API='https://prove2.me/api/v1'
          test -n "$PROVE2ME_API_KEY" || { echo 'PROVE2ME_API_KEY is not configured.' >&2; exit 2; }

          BODY=$(jq -nc --arg k "$PROVE2ME_API_KEY" '{api_key:$k}')
          RESPONSE=$(curl --fail-with-body --silent --show-error \
            -X POST "$API/agent/refresh" \
            -H 'Content-Type: application/json' \
            -d "$BODY")
          ACCESS=$(jq -r '.access_token // empty' <<<"$RESPONSE")
          VERSION=$(jq -r '.version // empty' <<<"$RESPONSE")
          test -n "$ACCESS" || { echo 'Authentication returned no access token.' >&2; exit 3; }

          echo "::add-mask::$ACCESS"
          echo "token=$ACCESS" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Authenticated; platform version: $VERSION"

      - name: Search every environment for a tiny standalone target
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          API='https://prove2.me/api/v1'

          curl --fail-with-body --silent --show-error "$API/environments" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -o environments.json

          jq -e '.environments | length > 0' environments.json >/dev/null
          : > hits.ndjson

          for REV in $(jq -r '.environments[].mathlib_rev' environments.json); do
            echo "Searching environment $REV"
            for Q in 'GF(3)' 'ZMod 3' 'Characteristic 3' 'char3'; do
              TMP=$(mktemp)
              curl --fail-with-body --silent --show-error --get "$API/theorems" \
                -H "Authorization: Bearer $ACCESS_TOKEN" \
                --data-urlencode 'status=Open' \
                --data-urlencode "q=$Q" \
                --data-urlencode 'limit=200' \
                --data-urlencode "env=$REV" \
                -o "$TMP"
              jq -c '.theorems[]?' "$TMP" >> hits.ndjson
              rm -f "$TMP"
            done
          done

          if [[ ! -s hits.ndjson ]]; then
            echo 'Keyword search returned no hits. Scanning newest open theorems in each environment.'
            for REV in $(jq -r '.environments[].mathlib_rev' environments.json); do
              TMP=$(mktemp)
              curl --fail-with-body --silent --show-error --get "$API/theorems" \
                -H "Authorization: Bearer $ACCESS_TOKEN" \
                --data-urlencode 'status=Open' \
                --data-urlencode 'sort=newest' \
                --data-urlencode 'limit=200' \
                --data-urlencode "env=$REV" \
                -o "$TMP"
              jq -c '.theorems[]? | select(
                ((.theorem_title // "") + " " + (.theorem_name // "") + " " + (.natural_language_statement // ""))
                | test("GF\\(3\\)|ZMod 3|Characteristic 3|char3"; "i")
              )' "$TMP" >> hits.ndjson
              rm -f "$TMP"
            done
          fi

          if [[ -s hits.ndjson ]]; then
            jq -s 'unique_by(.theorem_id) | map({
              theorem_id, theorem_name, theorem_title, status,
              formal_statement, natural_language_statement,
              preamble, source, mathlib_rev, created_by_username, created_at
            })' hits.ndjson > candidates.json
          else
            echo '[]' > candidates.json
          fi

          echo 'Supported environments:'
          jq '.environments' environments.json
          echo 'Candidate records:'
          jq '.' candidates.json

          {
            echo '## Prove2Me smoke target discovery'
            echo
            echo "- Platform version: `${{ steps.auth.outputs.version }}`"
            echo
            echo '### Candidates'
            echo '~~~json'
            jq '.' candidates.json
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

          test "$(jq 'length' candidates.json)" -gt 0 || {
            echo 'No matching tiny GF(3) theorem found across supported environments.' >&2
            exit 4
          }
