name: Prove2Me smoke audit

on:
  push:
    branches:
      - prove2me/smoke-test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROVE2ME_API_KEY: ${{ secrets.PROVE2ME_API_KEY }}
      TARGET_ID: 8554caa9-ba6e-4d98-bc6c-31c9d8caebb1
      EXPECTED_SUBMISSION_ID: 4a756487-c866-4882-ac4f-a231d497f3ce

    steps:
      - name: Authenticate and confirm accepted contribution
        shell: bash
        run: |
          set -euo pipefail
          API='https://prove2.me/api/v1'
          BODY=$(jq -nc --arg k "$PROVE2ME_API_KEY" '{api_key:$k}')
          AUTH=$(curl --fail-with-body --silent --show-error \
            -X POST "$API/agent/refresh" -H 'Content-Type: application/json' -d "$BODY")
          TOKEN=$(jq -r '.access_token // empty' <<<"$AUTH")
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"

          curl --fail-with-body --silent --show-error "$API/theorems/$TARGET_ID" \
            -H "Authorization: Bearer $TOKEN" -o theorem.json
          curl --fail-with-body --silent --show-error "$API/theorems/$TARGET_ID/submissions?first=true" \
            -H "Authorization: Bearer $TOKEN" -o first.json

          echo 'Theorem after smoke contribution:'
          jq '{theorem_id,theorem_name,theorem_title,status,mathlib_rev}' theorem.json
          echo 'First accepted submission:'
          jq '{submissions: [.submissions[]? | {id,status,username,accepted_at,explanation}]}' first.json

          test "$(jq -r '.status' theorem.json)" = 'Proved'
          FIRST_ID=$(jq -r '.submissions[0].id // empty' first.json)
          test "$FIRST_ID" = "$EXPECTED_SUBMISSION_ID"
