name: Prove2Me smoke discovery

on:
  push:
    branches:
      - prove2me/smoke-test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROVE2ME_API_KEY: ${{ secrets.PROVE2ME_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Prove2Me
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          API='https://prove2.me/api/v1'
          BODY=$(jq -nc --arg k "$PROVE2ME_API_KEY" '{api_key:$k}')
          RESPONSE=$(curl --fail-with-body --silent --show-error \
            -X POST "$API/agent/refresh" \
            -H 'Content-Type: application/json' \
            -d "$BODY")
          ACCESS=$(jq -r '.access_token // empty' <<<"$RESPONSE")
          VERSION=$(jq -r '.version // empty' <<<"$RESPONSE")
          test -n "$ACCESS"
          echo "::add-mask::$ACCESS"
          echo "token=$ACCESS" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Authenticated; platform version: $VERSION"

      - name: Rank standalone Open theorems for smoke testing
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          API='https://prove2.me/api/v1'
          curl --fail-with-body --silent --show-error "$API/environments" \
            -H "Authorization: Bearer $ACCESS_TOKEN" -o environments.json

          : > pool.ndjson
          for REV in $(jq -r '.environments[].mathlib_rev' environments.json); do
            for OFFSET in 0 200 400; do
              TMP=$(mktemp)
              curl --fail-with-body --silent --show-error --get "$API/theorems" \
                -H "Authorization: Bearer $ACCESS_TOKEN" \
                --data-urlencode 'status=Open' \
                --data-urlencode 'sort=newest' \
                --data-urlencode 'limit=200' \
                --data-urlencode "offset=$OFFSET" \
                --data-urlencode "env=$REV" \
                -o "$TMP"
              jq -c '.theorems[]?' "$TMP" >> pool.ndjson
              rm -f "$TMP"
            done
          done

          jq -s '
            unique_by(.theorem_id)
            | map(select(
                (.deprecated_at == null)
                and ((.preamble // "") | (contains("Definitions.Def_") or contains("Theorems.Thm_")) | not)
                and ((.formal_statement // "") | length < 700)
              )
              | . + {
                  statement_len: ((.formal_statement // "") | length),
                  import_len: ((.preamble // "") | length)
                })
            | sort_by(.statement_len, .import_len)
            | .[:50]
            | map({
                theorem_id, theorem_name, theorem_title, status,
                formal_statement, natural_language_statement,
                preamble, source, tags, mathlib_rev,
                created_by_username, created_at, statement_len
              })
          ' pool.ndjson > shortlist.json

          echo 'Shortest standalone Open theorem candidates:'
          jq '.' shortlist.json

          {
            echo '## Prove2Me standalone smoke-test candidates'
            echo
            echo "- Platform version: ${{ steps.auth.outputs.version }}"
            echo "- Candidate pool sampled: $(wc -l < pool.ndjson) Open records"
            echo
            echo '~~~json'
            jq '.' shortlist.json
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

          test "$(jq 'length' shortlist.json)" -gt 0
