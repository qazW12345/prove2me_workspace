name: Inspect Birkhoff variational flow period cocycle

on:
  push:
    branches:
      - prove2me/inspect-birkhoff-variational-cocycle
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PROVE2ME_API_KEY: ${{ secrets.PROVE2ME_API_KEY }}

    steps:
      - name: Inspect target theorem and context only
        shell: bash
        run: |
          set -euo pipefail
          API='https://prove2.me/api/v1'
          NAME='BirkhoffGlobalSection.variational_flow_period_cocycle'
          BODY=$(jq -nc --arg k "$PROVE2ME_API_KEY" '{api_key:$k}')
          AUTH=$(curl --fail-with-body --silent --show-error             -X POST "$API/agent/refresh"             -H 'Content-Type: application/json'             -d "$BODY")
          TOKEN=$(jq -r '.access_token // empty' <<<"$AUTH")
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"

          ENC=$(printf '%s' "$NAME" | jq -sRr @uri)
          RESP=$(curl --fail-with-body --silent --show-error "$API/theorems?q=$ENC&limit=100"             -H "Authorization: Bearer $TOKEN")
          MATCH=$(jq -c --arg n "$NAME" '
            (.theorems // .items // .results // .) |
            map(select(.theorem_name == $n)) |
            first // empty
          ' <<<"$RESP")
          test -n "$MATCH"
          ID=$(jq -r '.theorem_id // .id' <<<"$MATCH")

          echo "===== TARGET ====="
          curl --fail-with-body --silent --show-error "$API/theorems/$ID"             -H "Authorization: Bearer $TOKEN"             | jq '{theorem_id,theorem_name,theorem_title,status,formal_statement,natural_language_statement,preamble,source,tags,mathlib_rev,created_at}'

          echo "===== SUBMISSIONS ====="
          curl --fail-with-body --silent --show-error "$API/theorems/$ID/submissions"             -H "Authorization: Bearer $TOKEN"             | jq '{total:(.total // null), submissions:[(.submissions // .items // .results // [])[] | {id,status,proof_type,username,accepted_at,error_message,explanation}]}'

          echo "===== DECOMPOSITIONS ====="
          curl --fail-with-body --silent --show-error "$API/theorems/$ID/decompositions"             -H "Authorization: Bearer $TOKEN" | jq '.'

          echo "===== MISSIONS ====="
          curl --fail-with-body --silent --show-error "$API/theorems/$ID/missions"             -H "Authorization: Bearer $TOKEN" | jq '.'
