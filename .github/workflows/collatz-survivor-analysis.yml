name: Collatz Survivor Structure Analysis
# Re-run on stabilization scan changes

on:
  push:
    branches: [prove2me/collatz-residual-recursive-decompose]
    paths:
      - "scripts/analyze_collatz_survivor_language.py"
      - "scripts/analyze_collatz_2adic_survivors.py"
      - "scripts/analyze_collatz_stabilization_records.py"
      - "scripts/analyze_collatz_mod9_sampled.py"
      - ".github/workflows/collatz-survivor-analysis.yml"

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Analyze symbolic survivor language
        run: python3 scripts/analyze_collatz_survivor_language.py --max-word-length 100
      - name: Analyze 2-adic survivor structure
        run: python3 scripts/analyze_collatz_2adic_survivors.py
      - name: Scan stabilized survivor records through 2^30
        run: python3 scripts/analyze_collatz_stabilization_records.py --depth 30
      - name: Test sampled 2-mod-9 route through 2^28
        run: python3 scripts/analyze_collatz_mod9_sampled.py --depth 28
      - name: Commit report data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent-state/collatz-survivor-language.json agent-state/collatz-2adic-survivors.json agent-state/collatz-stabilization-records.json agent-state/collatz-mod9-sampled-scan.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: record Collatz survivor analysis"
            git pull --rebase origin prove2me/collatz-residual-recursive-decompose || true
            git push || true
          fi
