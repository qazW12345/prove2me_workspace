name: Collatz Survivor Structure Analysis

on:
  push:
    branches: [prove2me/collatz-residual-recursive-decompose]
    paths:
      - "scripts/analyze_collatz_survivor_language.py"
      - ".github/workflows/collatz-survivor-analysis.yml"

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Analyze symbolic survivor language
        run: python3 scripts/analyze_collatz_survivor_language.py --max-word-length 100
      - name: Commit report data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent-state/collatz-survivor-language.json agent-state/collatz-2adic-survivors.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: record Collatz survivor analysis"
            git pull --rebase origin prove2me/collatz-residual-recursive-decompose || true
            git push || true
          fi
