name: Prove2Me CookP Machine Definition
on:
  push:
    branches: [agent/prove2me-probe]
    paths:
      - ".github/workflows/prove2me-cookp-machine.yml"
      - "scripts/agent_cookp_publish_machine.py"
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROVE2ME_API_KEY: ${{ secrets.PROVE2ME_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/agent_cookp_publish_machine.py
