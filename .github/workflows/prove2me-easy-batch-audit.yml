name: Prove2Me easy batch status audit

on:
  push:
    branches:
      - prove2me/easy-batch-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROVE2ME_API_KEY: ${{ secrets.PROVE2ME_API_KEY }}

    steps:
      - name: Read theorem statuses
        shell: bash
        run: |
          set -euo pipefail
          API='https://prove2.me/api/v1'
          BODY=$(jq -nc --arg k "$PROVE2ME_API_KEY" '{api_key:$k}')
          AUTH=$(curl --fail-with-body --silent --show-error             -X POST "$API/agent/refresh"             -H 'Content-Type: application/json'             -d "$BODY")
          TOKEN=$(jq -r '.access_token // empty' <<<"$AUTH")
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"

          for ID in             da6228dd-b137-41bd-b91a-a132ca409087             e8882b56-97c0-4880-9aeb-8dcc1b0a7d5c             f99db012-dac2-49e4-95ac-5460abf468f9
          do
            echo "===== $ID ====="
            curl --fail-with-body --silent --show-error "$API/theorems/$ID"               -H "Authorization: Bearer $TOKEN"               | jq '{theorem_id,theorem_name,status,proved_at,disproved_at}'

            curl --fail-with-body --silent --show-error "$API/theorems/$ID/submissions"               -H "Authorization: Bearer $TOKEN"               | jq '{submissions: [.submissions[]? | {id,status,proof_type,username,accepted_at,error_message}]}'
          done
