name: Compile Prove2Me second block gcd

on:
  push:
    branches:
      - prove2me/second-block-gcd
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_MATHLIB_REV: 0df444a360eaa60ab8c11dca51a86af692955474
      TARGET_TOOLCHAIN: leanprover/lean4:v4.33.1
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v elan >/dev/null 2>&1; then
            curl --fail --silent --show-error https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Pin exact Prove2Me environment
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$TARGET_TOOLCHAIN" > lean-toolchain
          cat > lakefile.lean <<'EOF'
          import Lake
          open Lake DSL
          package «prove2me» where
            leanOptions := #[⟨`autoImplicit, false⟩]
          require mathlib from git
            "https://github.com/leanprover-community/mathlib4.git" @
            "__MATHLIB_REV__"
          @[default_target]
          lean_lib «Solutions» where
          EOF
          sed -i "s/__MATHLIB_REV__/$TARGET_MATHLIB_REV/" lakefile.lean
      - name: Fetch Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "$TARGET_MATHLIB_REV"
      - name: Compile exact solution
        shell: bash
        run: |
          set -euo pipefail
          lake build Solutions.Sol_OddPerfectNumber_Kernel_second_block_gcd_dvd_three
          ! grep -nE '(^|[^[:alpha:]])sorry([^[:alpha:]]|$)' Solutions/Sol_OddPerfectNumber_Kernel_second_block_gcd_dvd_three.lean
