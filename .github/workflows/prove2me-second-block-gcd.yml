name: Submit corrected Prove2Me second block gcd

on:
  push:
    branches:
      - prove2me/second-block-gcd
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROVE2ME_API_KEY: ${{ secrets.PROVE2ME_API_KEY }}
      TARGET_ID: 0e45b51d-915a-4c31-bec6-b2f945374870
      TARGET_NAME: OddPerfectNumber.Kernel.second_block_gcd_dvd_three
      TARGET_MATHLIB_REV: 0df444a360eaa60ab8c11dca51a86af692955474
    steps:
      - uses: actions/checkout@v4
      - name: Recheck target and submit corrected compiled proof
        shell: bash
        run: |
          set -euo pipefail
          API='https://prove2.me/api/v1'
          FILE='Solutions/Sol_OddPerfectNumber_Kernel_second_block_gcd_dvd_three.lean'
          ! grep -nE '(^|[^[:alpha:]])sorry([^[:alpha:]]|$)' "$FILE"
          grep -q '^theorem solution ' "$FILE"

          AUTH=$(curl --fail-with-body --silent --show-error             -X POST "$API/agent/refresh"             -H 'Content-Type: application/json'             -d "$(jq -nc --arg k "$PROVE2ME_API_KEY" '{api_key:$k}')")
          TOKEN=$(jq -r '.access_token // empty' <<<"$AUTH")
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"

          TARGET=$(curl --fail-with-body --silent --show-error "$API/theorems/$TARGET_ID"             -H "Authorization: Bearer $TOKEN")
          STATUS=$(jq -r '.status' <<<"$TARGET")
          test "$(jq -r '.theorem_name' <<<"$TARGET")" = "$TARGET_NAME"
          test "$(jq -r '.mathlib_rev' <<<"$TARGET")" = "$TARGET_MATHLIB_REV"
          if [[ "$STATUS" = 'Proved' ]]; then
            echo 'Target already Proved; not submitting duplicate.'
            exit 0
          fi
          test "$STATUS" = 'Open'

          EXPLANATION='Let d be the gcd. The case p=1 is immediate. Otherwise p % 4 = 1 implies p≥5 and p+1 is even, hence 2*((p+1)/2)=p+1, so d divides p+1. Since d also divides p^2-p+1, it divides (p-2)(p+1). For p≥5, Nat subtraction is exact and (p^2-p+1) - (p-2)(p+1) = 3. Therefore d divides 3.'

          SUBMIT=$(curl --fail-with-body --silent --show-error             -X POST "$API/verify"             -H "Authorization: Bearer $TOKEN"             -F "theorem_id=$TARGET_ID"             -F "file=@$FILE"             -F "proof_type=prove"             --form-string "explanation=$EXPLANATION")
          SID=$(jq -r '.submission_id // empty' <<<"$SUBMIT")
          VSTATUS=$(jq -r '.status // empty' <<<"$SUBMIT")
          test -n "$SID"
          echo "submission_id=$SID"

          for _ in $(seq 1 120); do
            if [[ "$VSTATUS" != 'PENDING' ]]; then break; fi
            sleep 5
            VERDICT=$(curl --fail-with-body --silent --show-error --get "$API/verify"               -H "Authorization: Bearer $TOKEN"               --data-urlencode "submission_id=$SID")
            VSTATUS=$(jq -r '.status // empty' <<<"$VERDICT")
            TSTATUS=$(curl --fail-with-body --silent --show-error "$API/theorems/$TARGET_ID"               -H "Authorization: Bearer $TOKEN" | jq -r '.status')
            echo "verifier=$VSTATUS theorem=$TSTATUS"
            if [[ "$TSTATUS" = 'Proved' ]]; then exit 0; fi
            if [[ "$TSTATUS" != 'Open' ]]; then exit 32; fi
          done
          [[ "$VSTATUS" = 'ACCEPTED' || "$VSTATUS" = 'SKETCH_ACCEPTED' ]]
